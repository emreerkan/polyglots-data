name: PR check

# pull_request_target runs this file and the checker as they are on the base
# branch, so a pull request cannot change the checks it is judged by. Nothing
# from the pull request runs here: its tree is only read, and its packages
# are installed without scripts. The one exception is the maintainer's pull
# request, whose own polyglots validates the rules files, so a pin bump and
# the files that need it can land together. No cache: a cache written here
# would be shared with the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: pr
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.16.0'
      - run: npm ci --ignore-scripts
        working-directory: trusted
      - run: npm ci --ignore-scripts
        working-directory: pr
      - name: Check
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git fetch --no-tags --quiet https://github.com/${{ github.repository }}.git "$BASE_SHA"
          ../trusted/node_modules/.bin/tsx ../trusted/src/cli/check.ts --base "$BASE_SHA" --head "$HEAD_SHA" --author "$PR_AUTHOR"
