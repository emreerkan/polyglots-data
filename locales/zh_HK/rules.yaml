# polyglots rules for zh_HK (Chinese (Hong Kong))
#
# Draft: only the name order, taken from CLDR 49 person names, where the
# "zh" data lists "zh" as surnameFirst. Not yet confirmed by the zh_HK locale
# team. The name-order check runs only with this key set.
#
# Check the file with: polyglots rules check --file locales/zh_HK/rules.yaml

schema: 3

names:
  order: family-first
