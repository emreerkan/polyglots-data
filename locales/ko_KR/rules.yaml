# polyglots rules for ko_KR (Korean)
#
# Draft: only the name order, taken from CLDR 49 person names, where the
# "ko" data lists "ko" as surnameFirst. Not yet confirmed by the ko_KR locale
# team. The name-order check runs only with this key set.
#
# Check the file with: polyglots rules check --file locales/ko_KR/rules.yaml

schema: 3

names:
  order: family-first
