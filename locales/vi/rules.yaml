# polyglots rules for vi (Vietnamese)
#
# Draft: only the name order, taken from CLDR 49 person names, where the
# "vi" data lists "vi" as surnameFirst. Not yet confirmed by the vi locale
# team. The name-order check runs only with this key set.
#
# Check the file with: polyglots rules check --file locales/vi/rules.yaml

schema: 3

names:
  order: family-first
