# polyglots rules for zh_TW (Chinese (Taiwan))
#
# Draft: only the name order, taken from CLDR 49 person names, where the
# "zh" data lists "zh" as surnameFirst. Not yet confirmed by the zh_TW locale
# team. The name-order check runs only with this key set.
#
# Check the file with: polyglots rules check --file locales/zh_TW/rules.yaml

schema: 3

names:
  order: family-first
