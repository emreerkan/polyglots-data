# polyglots rules for ja (Japanese)
#
# Draft: only the name order, taken from CLDR 49 person names, where the
# "ja" data lists "ja" as surnameFirst. Not yet confirmed by the ja locale
# team. The name-order check runs only with this key set.
#
# Check the file with: polyglots rules check --file locales/ja/rules.yaml

schema: 3

names:
  order: family-first
